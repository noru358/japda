/* DECISIONS
- 시점은 3/4(스타듀류). 벽·건물은 위로 WH px 솟아 보이고, 행 기준으로 앞뒤를 정렬한다. 충돌은 그대로 칸 단위.
- 벽을 클릭할 때는 솟은 윗면을 고려해 커서 WH만큼 아래 칸을 먼저 본다.
- 코어 3×3, 플레이어 투사체·광선은 플레이어 건물을 통과, 함정은 적이 공격하지 않음(v1 그대로).
- 코어가 받는 피해 ×0.5 유지.
- 적 길찾기: 일반 적은 열린 길이 있으면 건물을 돌아서 온다(미로 설계 가능). 길이 완전히 막혔을 때만 건물을 부순다. 굴멧돼지(공성형)는 가장 싼 길로 오며 벽을 부순다. 정령은 날아서 넘는다.
- 자원: 채굴기(광맥 옆에 지으면 무한 생산), 적 처치 시 자원, 나무 재생, 효율 채굴 연구.
- 전신주는 길을 막지 않는다(플레이어·적 모두 통과). 적은 여전히 전신주를 노리고 부순다.
- R은 진행 중이면 2.5초 안에 두 번 눌러야 재시작. 저장은 시제품 단계라 넣지 않음.
- 건물 선택: 건설 모드에서 건물 클릭, 평소에 건물을 클릭했는데 커서 근처에 적이 없을 때, 또는 E.
- v5 길 규칙: 모든 균열·둥지에서 모든 활성 코어까지 열린 길이 하나는 남아야 한다. 막는 건물은 지을 수 없다(닫힌 균열 포함). 그래도 막히면(지형 변화 등) 일반 적도 부순다.

- v25 빠른 수정: 오염된 땅에 효과(지을 수 없음, 그 위의 적 +30% 빠름, 새벽마다 연결된 영역 안은 정화되고 영역 밖은 조금씩 번짐). UI 가독성: 툴팁은 요약만(Alt 누르면 자세히), 자원은 아이콘+숫자 3열, 코어 목록은 접힘(클릭으로 펼침)·목표는 맨 위 항상, 보조 글씨색 진하게. 아스트라 보고서 반영: 무기 피해는 반올림하지 않음(표시는 소수 1자리), 무기 강화 비교에 '처치 타수'(굴멧돼지·돌 골렘), 돌진은 항상 Space·부적은 Shift(같은 종류 모두 업그레이드는 Alt+F), 본거지가 무너지면 체크포인트(이정표를 넘긴 뒤 첫 새벽 저장, 사용자 결정)로 돌아갈 수 있음.
- v26 포탑·보스: 포탑마다 노리는 적이 다름(석궁=비행·무방어 우선, 투석=가장 뭉친 곳, 수정=방어·체력 큰 적·한 줄). 수정 포탑은 비행 적을 못 맞춘다. 3단계 특수(석궁 관통1·투석 착탄 감속·수정 표식 +25%). 투석 1~3단계 피해·폭발 범위 상향. 함정 1단계 감속 20%. 새 건물 결계 등불(def2: 감속·마비 정령 교란 무효·정령 피해, 보스는 절반). 보스 규칙(사용자 결정): 포탑·함정·코어 포 피해는 보스에게 25%, 보스는 16칸 안의 나를 직접 노리고 '예고(붉은 표시)→돌진/내려찍기/탄막→빈틈(별, 내 피해 2배)'을 반복, 막히면 돌진으로 뚫는다. 보스전 동안 일반 밤 무리는 오지 않는다. 체력: 수호자 600·주인 1400·고대 골렘 500, 수호자 소환 제거.
- v27 캐릭터 액션(사용자 결정: 스킬 키 Q, 레벨업은 지금처럼 자동 수치 성장·추후 특성 카드/트리 가능, 흔들림 게이지 넣기): 무기 스킬 — 검 돌진베기(4칸 돌진, ×2.5, 무적), 석궁 관통 사격(×3, 전부 관통, 표식), 지팡이 둔화 장판(4초, 50% 감속, 0.5초마다 ×0.5). 재사용 대기는 무기 +3·+5에서 짧아짐. Q의 '직전 무기'는 없앰(휠·숫자로). 보스 흔들림: 내 공격만 채움(검 1.6배, 돌진베기 2배), 가득 차면 3초 쓰러짐(빈틈과 같은 2배), 3초 안 맞으면 줄어듦. 보스 체력 재조정(수호자 800·흔들림 380, 주인 2600·1000, 고대 골렘 600·300).
- v28 바이옴 연결(사용자 결정: 고산지대는 유적 다음·수호자 전 필수, 추위 강함, 서리 거인 보스, 유적은 퍼즐보다 분위기와 자유로운 거점·탐험·파밍): 맵 214×150(동쪽 확장, 기존 좌표 그대로). 고산지대 — 동굴 동쪽 끝 얼음벽(태양 횃불 필요, 태양석), 영역·화로 밖 추위(10초부터 느려짐, 20초부터 2초마다 체력 1, 화면 성에·입김, 수치 UI 없음), 서리 늑대, 서리 거인(냉기 부채꼴 입김·돌진·내려찍기, 산정 코어를 붙듦), 운철(갈고리·서리 외투·화로·운철 전신주·심연 채굴 연구), 얼음 틈 너머 고원 상자. 갈고리로 돌진하면 구덩이·얼음 틈을 건넌다 → 유적 금고(구덩이 해자 너머, 태양석·룬석·장신구). 유적 — 낮에도 어둡고 횃불·빛줄기·먼지·덩굴·석상, 되찾은 고대 포탑 주변 4칸이 영역(전진 기지), 새벽마다 기둥 잔해 재생·3번째 새벽마다 유물 상자. 동굴 북/남 정화(둥지 다 부수고 그쪽 코어 연결 → 둥지 재생 없음). 저장 형식 4.
- v29 습격 예산: 밤의 세기 n = 단계 기본값(골짜기 1·동굴 4·유적 7·고산 10·하드모드 14·엔딩 후 16) + 그 단계에서 지난 밤 수(최대 +3). 오래 준비해도 같은 단계면 3밤 뒤로는 더 세지지 않고, 진행해야 세진다. 핏빛 밤 1.5배·추가 균열 시점은 그대로. 둥지 체력 성장·주인 무리도 같은 n. 시계 툴팁에 위협 단계 표시.
- v30 바이옴 재배치(사용자 결정): 평원 → 수정동굴 → 사원(고대 제단) → 하드모드 → 고산지대(+추후 바이옴). 사원 입구는 동굴 남쪽 끝(두 번째 봉인, 동굴과 사원 사이 y96~97), 사원은 5×4 미로(굽은 폭 2 통로, 막다른 길, 방 성격 회랑·신전·수조·납골실), 맨 아래 왼쪽 성소에 고대 코어·고대 수호 골렘·제단(수호자·주인 모두 여기서). 수호자는 산정 코어 없이, 주인은 산정 코어까지. 고산 입구는 봉인된 얼음(하드모드에 금이 가고 태양 횃불로 녹임). 동굴 수정은 작은 광맥으로 흩고 발광 버섯 삭제. 고산은 능선·고개·빙하·깊은 눈(느려짐)·얼음 첨탑·운석 크레이터. 비행 적은 벽 위로 날아 넘는다(봉인·기반암만 막힘). 목표는 단계 목록(QUESTS) 하나로 문구·화살표 통일, 앞 단계 코어가 끊기면 그걸 먼저. 공물: 수호자의 공물에 태양석 4, 봉인의 핵은 흑철·정수·운철. 서리 거인 체력 1200. 저장 형식 5.
- v31 사원 지름길: 입구 방과 성소에 고대 승강석 한 쌍. 성소 쪽에서 E로 깨우면 이후 E 한 번에 오간다(순간이동 대기 공유).
- v32 숨은 바다(사용자 결정: 하드모드 전 필수, 사원 다음·수호자 전): 지도 남쪽으로 확장(H 210). 사원 맨 아래 줄 방의 계단 아래 수문(고대 골렘이 쓰러지면 열림) → 깊은 물 바다·모래 섬·얕은 물·산호초·진주조개. 뗏목(도구)이 있어야 깊은 물을 건넌다(조금 느림). 물속 매복꾼(깊은 물에서만 움직이고 가까우면 떠올라 문다). 심해 군주(동쪽 끝, 물속에선 무적, 떠올라 붉은 원 2~4개 → 빈틈 2.2초), 바다 코어(진주·돌). 진주: 진주 물갈퀴 장화·수호자의 공물(태양석 대신)·흑철 포신 연구·룬 결계 등불. 숨은 바다 균열은 밤에 정령·매복꾼(땅 경로 없음 → 길 검사 제외). 위협 단계에 '숨은 바다' 추가. 저장 형식 6.
- v33 하드모드 세 갈래(사용자 결정: 고산·화산 균열·오염지 순서 자유, 봉인의 주인은 세 갈래 코어 모두 필요, 남쪽 확장): 지도 H 272. 바다 남쪽 끝 계단 굴 둘(봉인된 바위 HSEAL, 하드모드에 화산암으로 금 감). 화산 균열(서쪽 x4~106 y210~270): 현무암·용암 강(LAVA=deep+lava, 지상·뗏목·헤엄 불가, 비행 통과)·흑요석/흑철 광맥, 코어 섬은 용암 해자 → 서리 등잔(철6·진주6·수정8)으로 걸어 들어가면 앞 용암이 식은 용암(CRUST, 영구)이 된다. 영역 밖에선 7~11초마다 화산탄(예고 1.1초, 피해 2, 30%는 흑요석 바위로 남음). 용암 도롱뇽, 화염 거신(분화 예고→빈틈). 오염지(동쪽 x108~210): 썩은 진흙·오염된 땅·오염 군체 벽·오염 결정. 영역 밖 오염된 땅을 밟으면 2.5초마다 부식 1(정화 망토로 면역), 영역 안 오염은 0.5초마다 진흙으로 밀려남, 심장 셋이 6초마다 번지고 새끼를 뿜음, 심장이 남으면 오염 모체는 고치 속(무적). 새 자원 흑요석(흑요석 갑옷: 화산탄 절반)·오염 결정(정화 망토). 봉인의 핵 = 흑철15·정수10·운철8·흑요석8·오염결정8. 목표는 BRANCH 목록(지금 선 갈래 → 마지막 갈래 → 남은 첫 갈래). 저장 버전 7.
